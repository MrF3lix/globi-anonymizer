# @package _global_

defaults:
  - _self_
  - paths: default
  - model: swissgpc_e6s7


device: auto
redis_url: ${oc.env:REDIS_URL,redis://localhost:6379/0}

worker:
  # only used for jobs without a transcript; base mangles dialect
  whisper_model: small
  heartbeat_ttl_seconds: 30
  claim_idle_seconds: 600
  max_attempts: 3
